site_name: Lakehouse Databricks - Trabalho 3
site_description: Documentacao do pipeline Lakehouse com Databricks Free Edition e Arquitetura Medalhao
site_author: Murilo

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Arquitetura: arquitetura.md
  - Base de Dados: dados.md
  - Execucao: execucao.md
  - Job Databricks: job.md
  - Modelo Gold: gold.md
  - Notebooks:
      - 001 - Preparando ambiente: notebooks/001_preparando_ambiente.md
      - 002 - Extracao: notebooks/002_extracao.md
      - 003 - Bronze: notebooks/003_bronze.md
      - 004 - Silver: notebooks/004_silver.md
      - 005 - Gold: notebooks/005_gold.md
      - 006 - Destruindo ambiente: notebooks/006_destruindo_ambiente.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

